:root{--bg:#f3f1ee;--surface:#fff;--ink:#1d2433;--muted:#6b7385;--accent:#2b5cff;--line:#dcd8d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#14171f;--surface:#1e222d;--ink:#eceef4;--muted:#9099ad;--accent:#7b9bff;--line:#2e3442;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:20px 16px 32px}
h1{font-size:1.3rem;margin:0 0 14px}
.now{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
#title{font-size:1.1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{color:var(--muted);font-size:.85rem;margin-top:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem}
.ctrl{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-width:44px}
button:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.main{background:var(--accent);color:#fff;border-color:var(--accent);padding:12px 22px;font-weight:700}

.vol{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}

.add input{display:none}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
li.cur{background:var(--surface);color:var(--accent);font-weight:700}
li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:18px}
#cover{display:none;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-bottom:14px}
:root{--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on:#0d1220}}
:root[data-theme="dark"]{--on:#0d1220}
body.cv{--ink:#fff;--muted:rgba(255,255,255,.72);--surface:rgba(0,0,0,.35);--line:rgba(255,255,255,.2);--accent:#fff;--on:#111}
main{position:relative}
#bgw{position:fixed;inset:0;z-index:-1;overflow:hidden;opacity:0;transition:opacity .6s}
#bgw.on{opacity:1}
#bgw::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42)}
#bg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(40px) saturate(1.3)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hd h1{margin:0;display:flex;align-items:center;gap:10px;letter-spacing:.2px}
.hd h1 .logo{width:32px;height:32px;flex:none;filter:drop-shadow(0 2px 6px rgba(138,77,255,.35))}
.hd div{display:flex;gap:6px}
.hd input{display:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;min-width:0;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer}
.ib{-webkit-tap-highlight-color:transparent}
.ib:focus:not(:focus-visible){outline:none}
@media (hover:hover){.ib:hover{background:var(--line)}}
.ib svg{width:24px;height:24px}
.ib.on{color:var(--accent);background:var(--line)}
.ib.big{width:68px;height:68px;background:var(--accent);color:var(--on)}
.ib.big:hover{background:var(--accent);filter:brightness(1.08)}
.ib.big svg{width:30px;height:30px}
.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#play .pa{display:none}
#play.playing .pl{display:none}
#play.playing .pa{display:block}
.now{background:transparent;border:0;padding:4px}
#cover,#ph{width:100%;max-width:320px;margin:0 auto 18px;border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.3)}
#ph{display:flex;aspect-ratio:1;align-items:center;justify-content:center;background:var(--line);color:var(--muted)}
#ph svg{width:30%;height:30%}
#title{font-size:1.3rem;text-align:center}
#sub{text-align:center}
.ctrl{gap:6px;margin:12px 0}
.vol{justify-content:center;max-width:260px;margin:0 auto}
.vol svg{width:20px;height:20px;flex:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;max-height:72vh;display:flex;flex-direction:column;background:var(--surface);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translate(-50%,105%);visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s}
#sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .3s ease,visibility 0s}
body.cv #sheet{background:rgba(15,15,20,.78)}
#sheet header{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 18px;font-weight:700}
#sheet ul{overflow:auto;padding:0 8px 12px}
li.cur{background:var(--line)}
#rep{position:relative}
#rep[data-m="2"]::after{content:"1";position:absolute;right:9px;bottom:7px;font-size:.62rem;font-weight:700;line-height:1}
#tabs{display:flex;gap:6px;padding:0 12px 8px}
#tabs button{flex:1;min-width:0;padding:8px 6px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font-size:.85rem;cursor:pointer}
#tabs button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
li.grp,li.back{justify-content:flex-start;align-items:center;gap:12px}
li.back{color:var(--accent);font-weight:700}
.th{width:48px;height:48px;flex:none;border-radius:8px;object-fit:cover;background:var(--line)}
.tx{display:flex;flex-direction:column;min-width:0}
.tx b,.tx small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--muted);font-size:.78rem}
li .tx{flex:1}
.qb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;padding:0;min-width:0;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.qb svg{width:20px;height:20px}
@media (hover:hover){.qb:hover{background:var(--line);color:var(--ink)}}
li.nw{cursor:default}
li.qh{cursor:default;align-items:center;color:var(--muted);font-size:.85rem}
li.qh button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:6px 8px;min-width:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:10px 16px;border-radius:999px;background:rgba(20,20,26,.92);color:#fff;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tabs button{font-size:.8rem}
#sub{cursor:pointer}
#page{--bg:#f3f1ee;--surface:#fff;--ink:#1d2433;--muted:#6b7385;--line:#dcd8d2;--accent:#2b5cff;--on:#fff;position:fixed;inset:0;z-index:3;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #page{--bg:#14171f;--surface:#1e222d;--ink:#eceef4;--muted:#9099ad;--line:#2e3442;--accent:#7b9bff;--on:#0d1220}}
:root[data-theme="dark"] #page{--bg:#14171f;--surface:#1e222d;--ink:#eceef4;--muted:#9099ad;--line:#2e3442;--accent:#7b9bff;--on:#0d1220}
#page.on{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
#pbg{position:absolute;left:0;right:0;top:0;height:360px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.4);transform:scale(1.4);opacity:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);pointer-events:none}
#pscroll{position:relative;flex:1;overflow:auto;width:100%;max-width:480px;margin:0 auto;padding:4px 16px 100px}
#phero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 8px}
.pimg{width:190px;height:190px;object-fit:cover;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.pimg.round{border-radius:50%}
.pph{display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted)}
.pph svg{width:40%;height:40%}
.pname{font-size:1.6rem;line-height:1.15;margin:14px 0 4px}
.psub{color:var(--muted);font-size:.9rem}
.plink{background:none;border:0;padding:0;min-width:0;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
#pact{display:flex;align-items:center;gap:4px;margin:10px 0 6px}
.sp{flex:1}
.pst{font-size:1.1rem;margin:18px 0 8px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px}
.cimg.round{border-radius:50%}
.psearch{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit}
.pcard{display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.cimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:6px}
.pcard b,.pcard small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard small{color:var(--muted);font-size:.78rem}
.ptl{list-style:none;margin:0;padding:0}
.prow{align-items:center;justify-content:flex-start;gap:12px}
.prow .th{width:44px;height:44px}
.pn{width:28px;text-align:center;color:var(--muted);flex:none}
.prow.cur .tx b{color:var(--accent)}
#mini{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;display:none;align-items:center;gap:10px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
#mimg{width:42px;height:42px;border-radius:6px;object-fit:cover;background:var(--line);flex:none}
#mini .tx{flex:1}
#mplay .pa{display:none}
#mplay.playing .pl{display:none}
#mplay.playing .pa{display:block}

#cover,#ph{cursor:pointer}
#lsheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;height:80vh;display:flex;flex-direction:column;background:var(--surface);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translate(-50%,105%);visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s}
#lsheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .3s ease,visibility 0s}
body.cv #lsheet{background:rgba(15,15,20,.78)}
#lsheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 18px;font-weight:700}
#ltitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lbody{overflow:auto;padding:8px 22px 48px;text-align:center}
.ll{margin:0;padding:9px 0;font-size:1.25rem;line-height:1.35;font-weight:700;color:var(--muted);opacity:.6;cursor:pointer;transition:color .25s,opacity .25s,transform .25s}
.ll.on{color:var(--ink);opacity:1;transform:scale(1.04)}
.lp{white-space:pre-wrap;line-height:1.7;margin:0;font-size:1.05rem}
.lm{color:var(--muted);padding:30px 0}
.lm button{display:block;margin:14px auto 0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
#sheet{top:0;height:100%;max-height:none;border:0;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
#lbox2{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#lbox2>ul{flex:1;min-height:0;width:100%}
#page{position:absolute;padding-top:0}
#mini{bottom:10px}
#sheet .ptl{padding:0;overflow:visible}
#qsec{margin-top:18px}
#qhd{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px;font-weight:700}
#qclear{border:0;background:transparent;color:var(--accent);font-weight:700;padding:6px 8px;min-width:0;font-size:.85rem}
#qlist{max-height:280px;overflow:auto}
#qscrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#qscrim.on{opacity:1;pointer-events:auto}
#qsheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;height:78vh;display:flex;flex-direction:column;background:var(--surface);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px 18px 0 0;transform:translate(-50%,calc(100% - 64px - env(safe-area-inset-bottom,0px)));transition:transform .3s ease}
#qsheet.on{transform:translate(-50%,0)}
body.cv #qsheet{background:rgba(15,15,20,.92)}
#qgrab{flex:none;height:64px;padding:8px 16px 0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.grip{display:block;width:36px;height:4px;border-radius:2px;background:var(--muted);opacity:.5;margin:0 auto 10px}
.qrow{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.qr{display:flex;align-items:center;gap:6px}
.qchev{width:22px;height:22px;transition:transform .3s}
#qsheet.on .qchev{transform:rotate(180deg)}
#qsheet:not(.on) #qclear{display:none}
#qlist{flex:1;min-height:0;max-height:none;overflow:auto;padding:0 8px calc(12px + env(safe-area-inset-bottom,0px))}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

.pinfo{margin-top:6px}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pchip{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;color:var(--muted)}
.pbio{white-space:pre-line;line-height:1.55;font-size:.92rem;margin:0}
.pbio.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.psrc{color:var(--muted);font-size:.78rem;margin-top:8px}
.psrc a{color:inherit}
.psrc button,.plnk{background:none;border:0;padding:4px 0;min-width:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
.psrc button{font-size:.78rem;margin-left:8px;padding:0}
.plnk{display:block;margin-top:4px;font-size:.88rem}
/* página de artistas/álbuns: mesmo cinza da biblioteca */
#page{background:var(--surface)}
body.cv #page{--ink:#fff;--muted:rgba(255,255,255,.72);--line:rgba(255,255,255,.2);--accent:#fff;--on:#111;--surface:rgba(0,0,0,.35);background:rgba(15,15,20,.78)}
li.ahost{display:block;cursor:default;border:0;padding:4px 4px 12px;border-radius:0}
.ahost .psearch{display:block;width:100%;margin:4px 0 10px}
.ahost .acount{margin:0 0 14px}
#list{transition:visibility 0s}
#lbox2:has(#page.on)>#list{visibility:hidden;transition:visibility 0s .25s}

/* páginas de artista/álbum em tela cheia, sem o cabeçalho da biblioteca */
#page{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px)}
body.cv #page{background:transparent}
#sheet:has(#page.on)>header,#sheet:has(#page.on)>#tabs,#sheet:has(#page.on) #list{visibility:hidden;transition:visibility 0s .25s}
/* lista de faixas */
li.tcount{cursor:default;border:0;padding:2px 10px 10px;color:var(--muted);font-size:.85rem;justify-content:flex-start}
li.trk{align-items:center;justify-content:flex-start;gap:12px;padding:8px 10px;border-bottom:0;border-radius:14px;margin-bottom:2px;transition:background .2s}
@media (hover:hover){li.trk:hover{background:var(--line)}}
li.trk.cur{background:var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 24%,transparent),transparent 92%);font-weight:400}
li.trk.cur .tx b{color:var(--accent)}
.tth{position:relative;display:flex;align-items:center;justify-content:center;width:50px;height:50px;flex:none;border-radius:12px;overflow:hidden;background:var(--line);color:var(--muted);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tth img{width:100%;height:100%;object-fit:cover;display:block}
.tth svg{width:46%;height:46%}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:14px 0;background:rgba(0,0,0,.5);font-style:normal}
li.trk.cur .eq{display:flex}
.eq b{display:block;width:3px;height:45%;border-radius:2px;background:#fff}
.eq b:nth-child(2){height:75%}.eq b:nth-child(3){height:55%}
@keyframes eqb{0%,100%{height:25%}50%{height:95%}}
.plg li.trk.cur .eq b{animation:eqb .9s ease-in-out infinite}
.plg li.trk.cur .eq b:nth-child(2){animation-delay:.25s}
.plg li.trk.cur .eq b:nth-child(3){animation-delay:.5s}
@media (prefers-reduced-motion:reduce){.plg li.trk.cur .eq b{animation:none}}
.td{flex:none;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}

/* mini player em toda a biblioteca */
#mini{z-index:4;bottom:calc(10px + env(safe-area-inset-bottom,0px));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
body.cv #mini{background:rgba(24,24,32,.9)}
#sheet #list{padding-bottom:92px}
</style>
</head>

function load(n,play){

function next(auto){

    if(i>=0)hist.push(i);

function dec(b,enc){

  else s=new TextDecoder('windows-1252').decode(b);
  return s.split('\0')[0].trim();
}
async function readTags(file){
  const t={};
  try{
    const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(head[0]===0x49&&head[1]===0x44&&head[2]===0x33){
      const ver=head[3],v2=ver===2,hl=v2?6:10;
      const size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];
      const buf=new Uint8Array(await file.slice(10,10+size).arrayBuffer());
      const map={TIT2:'title',TT2:'title',TPE1:'artist',TP1:'artist',TALB:'album',TAL:'album'};
      let p=0;
      while(p+hl<=buf.length){
        const id=String.fromCharCode(...buf.subarray(p,p+(v2?3:4)));
        if(!/^[A-Z0-9]+$/.test(id))break;
        let sz;
        if(v2)sz=(buf[p+3]<<16)|(buf[p+4]<<8)|buf[p+5];
        else if(ver===4)sz=(buf[p+4]<<21)|(buf[p+5]<<14)|(buf[p+6]<<7)|buf[p+7];
        else sz=((buf[p+4]<<24)|(buf[p+5]<<16)|(buf[p+6]<<8)|buf[p+7])>>>0;
        const d=buf.subarray(p+hl,p+hl+sz);p+=hl+sz;
        if(!d.length)continue;
        const m=map[id];
        if(m&&!t[m])t[m]=dec(d.subarray(1),d[0]);
        else if((id==='APIC'||id==='PIC')&&!t.cover){
          const enc=d[0];let q=1;
          if(v2)q=4;else{while(q<d.length&&d[q]!==0)q++;q++}
          q++;
          if(enc===1||enc===2){while(q+1<d.length&&!(d[q]===0&&d[q+1]===0))q+=2;q+=2}
          else{while(q<d.length&&d[q]!==0)q++;q++}
          const img=d.subarray(q);
          if(img.length>100){t.coverBlob=new Blob([img],{type:img[0]===0x89?'image/png':'image/jpeg'});t.cover=URL.createObjectURL(t.coverBlob)}
        }
      }
    }
    if(!t.title&&file.size>128){
      const e=new Uint8Array(await file.slice(file.size-128).arrayBuffer());
      if(e[0]===0x54&&e[1]===0x41&&e[2]===0x47){
        const f=(a,b)=>dec(e.subarray(a,b),0);
        t.title=f(3,33);t.artist=t.artist||f(33,63);t.album=t.album||f(63,93);
      }
    }
  }catch(err){}
  return t;
}
const DB=new Promise(res=>{try{const r=indexedDB.open('player-local',1);r.onupgradeneeded=()=>r.result.createObjectStore('tracks',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});

function parseLrc(s){

    const txt=l.replace(/\[[^\]]*\]/g,'').trim();
    for(const m of l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g))out.push({t:(+m[1])*60+(+m[2]),txt});
  });

}
async function getLyrics(tr){
  const ck=LK+keyOf(tr);
  try{const c=localStorage.getItem(ck);if(c)return JSON.parse(c)}catch(e){}
  if(!isFinite(a.duration)&&a.readyState<1)await new Promise(r=>{a.addEventListener('loadedmetadata',r,{once:true});setTimeout(r,2500)});
  const dur=isFinite(a.duration)?Math.round(a.duration):0;
  let r=null;
  try{
    if(tr.artist&&tr.album&&dur){
      const x=await fetch('https://lrclib.net/api/get?'+new URLSearchParams({track_name:tr.name,artist_name:tr.artist,album_name:tr.album,duration:dur}));
      if(x.ok)r=await x.json();else if(x.status!==404)throw new Error('http '+x.status);
    }
    if(!r){
      const q=new URLSearchParams({track_name:tr.name});if(tr.artist)q.set('artist_name',tr.artist);
      const x=await fetch('https://lrclib.net/api/search?'+q);
      if(!x.ok)throw new Error('http '+x.status);
      const arr=await x.json();
      r=arr.find(z=>z.syncedLyrics&&(!dur||Math.abs(z.duration-dur)<=3))||arr.find(z=>z.syncedLyrics)||arr[0]||null;
    }
  }catch(e){return{error:true}}
  const res=r?{synced:r.syncedLyrics||'',plain:r.plainLyrics||'',instr:!!r.instrumental}:{none:true};
  try{localStorage.setItem(ck,JSON.stringify(res))}catch(e){}
  return res;
}

const IK='info1:',TTL_OK=30*864e5,TTL_NONE=7*864e5;

let iChain=Promise.resolve(),renderTok=0;
const iKey=(kind,a,b)=>kind+':'+nrm(a)+(b!=null?'|'+nrm(b):'');
function iGet(kind,a,b){

  try{
    const s=localStorage.getItem(IK+k);
    if(s){const o=JSON.parse(s);if(Date.now()-o.t<(o.none?TTL_NONE:TTL_OK)){iMem.set(k,o);return o}localStorage.removeItem(IK+k)}
  }catch(e){}

}
function iPut(kind,a,b,o){o.t=Date.now();const k=iKey(kind,a,b);iMem.set(k,o);try{localStorage.setItem(IK+k,JSON.stringify(o))}catch(e){}}

async function jget(url){

function clip(s,n){

const langs=()=>WL==='pt'?['pt','en']:['en','pt'];

async function fetchArtist(name){
  const q=primary(name),r={};let ok=0;
  try{
    const j=await jget('https://www.theaudiodb.com/api/v1/json/2/search.php?s='+enc(q));ok++;

        const p=ps.find(z=>nrm(z.title.replace(/\s*\(.*\)\s*$/,''))===nrm(q)&&MUSIC_RE.test(z.extract||''));

function iFetch(kind,a,b){
  const k=iKey(kind,a,b);
  if(iBusy.has(k))return iBusy.get(k);
  const p=iSlot(()=>kind==='artist'?fetchArtist(a):fetchAlbum(a,b))
    .then(r=>{if(!r.fail)iPut(kind,a,b,r);return r})
    .catch(()=>({fail:true}))
    .finally(()=>iBusy.delete(k));
  iBusy.set(k,p);return p;
}
async function iLoad(kind,a,b){
  if(kind==='artist'?(!a||a===ART_UNK):(!b||b===ALB_UNK))return{none:true};
  return iGet(kind,a,b)||iFetch(kind,a,b);
}
function lazy(node,root,fn){
  if(!('IntersectionObserver' in window)){fn();return}
  const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();fn()}},{root,rootMargin:'200px'});
  io.observe(node);
}
function webImg(url,cls,fb){
  const im=mk('img',cls);im.alt='';im.referrerPolicy='no-referrer';
  im.onerror=()=>{if(fb&&im.parentNode)im.replaceWith(fb)};
  im.src=url;return im;
}
function upgradeImg(el,url,cls){
  if(!url||!el||!el.parentNode)return;
  el.replaceWith(webImg(url,cls,el.cloneNode(true)));
}
function artistThumb(c,name,cls,root){
  if(!name||name===ART_UNK)return;
  const ci=iGet('artist',name);
  if(ci){if(ci.img)upgradeImg(c.firstChild,ci.img,cls);return}
  lazy(c,root,()=>iLoad('artist',name).then(r=>{if(r&&r.img)upgradeImg(c.firstChild,r.img,cls)}));
}
function albumThumb(c,artist,album,cls,root){
  if(!album||album===ALB_UNK)return;
  const ci=iGet('album',artist,album);
  if(ci){if(ci.img)upgradeImg(c.firstChild,ci.img,cls);return}
  lazy(c,root,()=>iLoad('album',artist,album).then(r=>{if(r&&r.img)upgradeImg(c.firstChild,r.img,cls)}));
}
function drawInfo(box,r,kind,retry){
  box.innerHTML='';
  const note=(txt,btn)=>{
    const d=mk('div','psrc',txt);
    if(btn){const b=mk('button','',btn);b.onclick=retry;d.appendChild(b)}
    box.appendChild(d);
  };
  if(!r||r.fail){note('Não foi possível buscar as informações. Verifique a conexão.','Tentar de novo');return}
  if(r.none){note(kind==='artist'?'Nenhuma informação online encontrada para este artista.':'Nenhuma informação online encontrada para este álbum.','Buscar de novo');return}
  box.appendChild(mk('h3','pst',kind==='artist'?'Sobre o artista':'Sobre o álbum'));
  const meta=kind==='artist'
    ?[r.genre,r.country,r.year&&('Desde '+r.year)]
    :[r.year,r.genre,r.label,r.tracks&&plural(+r.tracks,' faixa',' faixas')];
  const chips=meta.filter(Boolean);
  if(chips.length){const m=mk('div','pmeta');chips.forEach(c=>m.appendChild(mk('span','pchip',String(c))));box.appendChild(m)}
  if(r.bio){
    const p=mk('p','pbio clamp',r.bio);box.appendChild(p);
    if(r.bio.length>380){
      const b=mk('button','plnk','Ler mais');
      b.onclick=()=>{const open=p.classList.toggle('clamp');b.textContent=open?'Ler mais':'Ler menos'};
      box.appendChild(b);
    }
  }
  const s=mk('div','psrc');
  if(r.srcs&&r.srcs.length){
    s.append('Fonte: ');
    r.srcs.forEach((n,k)=>{
      if(k)s.append(', ');
      if(r.url&&/^https:\/\//.test(r.url)&&/wikip/i.test(n)){const a=mk('a','',n);a.href=r.url;a.target='_blank';a.rel='noopener';s.appendChild(a)}
      else s.append(n);
    });
  }
  const rb=mk('button','','Atualizar');rb.onclick=retry;s.appendChild(rb);
  box.appendChild(s);
}
function infoInto(box,kind,a,b,tok,onImg){
  const run=()=>{
    const c=iGet(kind,a,b);
    const draw=r=>{
      if(tok!==renderTok||!box.isConnected)return;
      drawInfo(box,r,kind,()=>{iDrop(kind,a,b);run()});
      if(r&&r.img&&onImg)onImg(r.img);
    };
    if(c){draw(c);return}
    box.innerHTML='';box.appendChild(mk('div','psrc','Buscando informações…'));
    iLoad(kind,a,b).then(draw);
  };
  run();
}
function showCover(url){
  const cv=$('cover');cv.src=url;cv.style.display='block';$('ph').style.display='none';
  $('bg').style.backgroundImage='url("'+url.replace(/"/g,'%22')+'")';
  $('bgw').classList.add('on');document.body.classList.add('cv');
}
$('cover').onerror=()=>{
  const t=tracks[i];if(t&&t.cover)return;
  const cv=$('cover');cv.removeAttribute('src');cv.style.display='none';$('ph').style.display='flex';
  $('bgw').classList.remove('on');document.body.classList.remove('cv');
};
async function webCover(n){
  const tk=tracks[n];if(!tk||tk.cover)return;
  let u=tk.web;
  if(!u){
    let r=null;
    if(tk.album&&tk.artist)r=await iLoad('album',tk.artist,tk.album);
    u=r&&r.img;
    if(!u&&tk.artist){const r2=await iLoad('artist',tk.artist);u=r2&&r2.img}
    if(!u)return;
    tk.web=u;
  }
  if(i!==n||tracks[n]!==tk||tk.cover)return;
  showCover(u);updMini();
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:tk.name,artist:tk.artist||'',album:tk.album||'',artwork:[{src:u}]})}catch(e){}}
}

/* ===== Estado da reprodução: sobrevive se o navegador recarregar a página ===== */
const SK='pstate1';let ready=false,sLast=0;
function saveState(force){
  if(!ready)return;
  const now=Date.now();if(!force&&now-sLast<1500)return;sLast=now;
  try{
    const k=n=>tracks[n]&&tracks[n].key;
    localStorage.setItem(SK,JSON.stringify({cur:k(i)||null,pos:a.currentTime||0,playing:!a.paused,
      queue:queue.map(k).filter(Boolean),qplayed:qplayed.map(k).filter(Boolean),qi,shuf,rep,vol:a.volume}));
  }catch(e){}
}
function restoreState(){
  let s=null;try{s=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
  if(!s){load(0,false);return}
  const idx=new Map();tracks.forEach((t,n)=>idx.set(t.key,n));
  const ci=idx.get(s.cur);
  shuf=!!s.shuf;rep=[0,1,2].includes(s.rep)?s.rep:0;
  if(typeof s.vol==='number'){a.volume=Math.min(1,Math.max(0,s.vol));$('vol').value=a.volume}
  queue=(s.queue||[]).map(k=>idx.get(k)).filter(n=>n!=null);
  qplayed=(s.qplayed||[]).map(k=>idx.get(k)).filter(n=>n!=null);
  fromQ=(rep===1&&Number.isInteger(s.qi)&&s.qi>=0&&s.qi<queue.length)?s.qi:-1;
  load(ci!=null?ci:0,false);
  if(ci!=null&&s.pos>1){a.addEventListener('loadedmetadata',()=>{try{a.currentTime=s.pos}catch(e){}},{once:true});toast('Retomado de onde você parou')}
  syncBtns();renderQueue();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')saveState(true);
  else if(ready){$('play').classList.toggle('playing',!a.paused);$('mplay').classList.toggle('playing',!a.paused);updMini();markPlaying();renderQueue()}
});
window.addEventListener('pagehide',()=>saveState(true));
$('pback').onclick=pageBack;
$('mini').onclick=()=>openList(false);
$('mini').onkeydown=e=>{if(e.key==='Enter')openList(false)};
$('mplay').onclick=e=>{e.stopPropagation();$('play').click()};
$('mplay').onkeydown=e=>e.stopPropagation();
$('sub').onclick=()=>{const t=tracks[i];if(t&&t.artist)openArtist(artKey(t))};
let armed=false;
$('clearLib').onclick=async()=>{
  if(!armed){armed=true;toast('Toque de novo para apagar todas as músicas salvas');setTimeout(()=>armed=false,3000);return}
  armed=false;await dbClear();a.pause();a.removeAttribute('src');
  tracks=[];queue=[];qplayed=[];hist=[];i=-1;qi=-1;sel=null;art=null;
  $('title').textContent='Nenhuma faixa';$('sub').textContent='Adicione arquivos para começar';
  $('cover').style.display='none';$('ph').style.display='flex';$('bgw').classList.remove('on');document.body.classList.remove('cv');
  $('cur').textContent='0:00';$('dur').textContent='0:00';$('seek').value=0;$('play').classList.remove('playing');
  render();toast('Músicas apagadas');
};
(async()=>{
  const recs=await dbAll();
  if(!recs||!recs.length)return;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  recs.forEach(r=>tracks.push({id:r.id,key:r.key,name:r.name,artist:r.artist,album:r.album,cover:r.cover?URL.createObjectURL(r.cover):null,url:URL.createObjectURL(r.file)}));
  render();restoreState();
})().finally(()=>{ready=true});
a.onplay=()=>{list.classList.add('plg');$('play').classList.add('playing');$('mplay').classList.add('playing')};
a.onpause=()=>{list.classList.remove('plg');$('play').classList.remove('playing');$('mplay').classList.remove('playing')};
a.ontimeupdate=()=>{saveState();syncLyr();$('cur').textContent=fmt(a.currentTime);if(a.duration)$('seek').value=a.currentTime/a.duration*100};
a.onloadedmetadata=()=>$('dur').textContent=fmt(a.duration);
a.onended=()=>{if(rep===2){a.currentTime=0;a.play()}else next(true)};
document.addEventListener('keydown',e=>{
  if((e.target.tagName==='INPUT'&&e.target.type!=='file')||e.target.tagName==='BUTTON')return;
  if(e.code==='Space'){e.preventDefault();$('play').click()}
  if(e.code==='ArrowRight')a.currentTime+=5;
  if(e.code==='ArrowLeft')a.currentTime-=5;
});
</script>
